[project]
name = "paperlens-backend"
version = "0.1.0"
description = "FastAPI backend for the PaperLens core MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "redis>=5.0.0",
  "uvicorn[standard]>=0.34.0",
  "pydantic-settings>=2.7.0",
  "pymupdf>=1.25.1",
  "python-multipart>=0.0.20",
  "psycopg[binary]>=3.2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "httpx>=0.28.0",
  "httpx2>=0.28.0",
  "ruff==0.16.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pin the rule set to ruff's historical default (pyflakes + a subset of
# pycodestyle). Newer ruff versions expand the implicit default select, which
# silently turned CI red without any code change; selecting explicitly keeps
# linting deterministic across ruff upgrades.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
