name: Production smoke

on:
  workflow_dispatch:
    inputs:
      frontend_base_url:
        description: GitHub Pages frontend base URL
        required: false
        default: https://nebu-25.github.io/Paperlens_26.06
      api_base_url:
        description: Render backend base URL
        required: false
        default: https://paperlens-backend-53ki.onrender.com
      check_ocr:
        description: Run one-page OCR comparison smoke check (uses the demo account and incurs OCR usage)
        required: false
        type: boolean
        default: false
      ocr_release_tag:
        description: Optional draft release tag containing PDF assets for OCR comparison
        required: false
        default: ''
  workflow_run:
    workflows: ["Deploy frontend to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download OCR smoke PDF assets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_ocr && inputs.ocr_release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OCR_RELEASE_TAG: ${{ inputs.ocr_release_tag }}
          OCR_SMOKE_DIR: ${{ runner.temp }}/ocr-smoke
        run: |
          mkdir -p "$OCR_SMOKE_DIR"
          gh release download "$OCR_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.pdf' --dir "$OCR_SMOKE_DIR"
          test -n "$(find "$OCR_SMOKE_DIR" -maxdepth 1 -type f -name '*.pdf' -print -quit)"

      - name: Run production smoke checks
        env:
          FRONTEND_BASE_URL: ${{ github.event.inputs.frontend_base_url || 'https://nebu-25.github.io/Paperlens_26.06' }}
          API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://paperlens-backend-53ki.onrender.com' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PAPERLENS_SMOKE_EMAIL: ${{ secrets.PAPERLENS_SMOKE_EMAIL }}
          PAPERLENS_SMOKE_PASSWORD: ${{ secrets.PAPERLENS_SMOKE_PASSWORD }}
          PAPERLENS_DEMO_EMAIL: ${{ secrets.PAPERLENS_DEMO_EMAIL }}
          PAPERLENS_DEMO_PASSWORD: ${{ secrets.PAPERLENS_DEMO_PASSWORD }}
          PAPERLENS_OCR_SMOKE: ${{ github.event.inputs.check_ocr == 'true' }}
          PAPERLENS_OCR_SMOKE_DIR: ${{ runner.temp }}/ocr-smoke
        run: python3 backend/scripts/smoke_deployment.py
